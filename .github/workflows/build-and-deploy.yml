name: Build Firmware & Deploy to Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and extract Telink TC32 toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tc32_toolchain
          curl.exe -fSL -o tc32.tar.xz "https://doc.telink-semi.cn/tools/vsc/windows/toolchains/tc32_130_Windows.tar.xz"
          tar.exe -xf tc32.tar.xz -C tc32_toolchain
          
          # Add toolchain directories to PATH for all subsequent steps
          $workspace = "${{ github.workspace }}"
          "$workspace/tc32_toolchain/tc32/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$workspace/tc32_toolchain/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G Ninja -DTC32_TOOLCHAIN_PATH="${{ github.workspace }}/tc32_toolchain/tc32/bin"

      - name: Build all firmware targets
        shell: pwsh
        run: |
          cmake --build build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./bin
          publish_branch: gh-pages

